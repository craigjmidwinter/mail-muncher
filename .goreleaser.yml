version: 2

project_name: mail-muncher

before:
  hooks:
    - go mod download

builds:
  - id: mail-muncher
    main: ./cmd/mail-muncher
    binary: mail-muncher
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    # Match what `make build` stamps: a leading-v version string, so
    # `mail-muncher --version` reports the tag exactly.
    ldflags:
      - -s -w -X main.version=v{{ .Version }}

archives:
  - id: mail-muncher
    ids:
      - mail-muncher
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - README.md
      - LICENSE
      - src: examples/*.yml
        dst: examples

checksum:
  name_template: checksums.txt
  algorithm: sha256

# A container image on GHCR, built from the binaries above rather than from
# source. Two reasons it exists: it is the install path that needs nothing on
# the host but a container runtime, and the official MCP Registry indexes
# servers by distributable package, of which an OCI image is one. The registry
# does not accept a bare GitHub release of Go binaries, so without this there
# is no listing.
#
# `dockers_v2` is goreleaser's buildx-based image builder: one multi-arch
# manifest assembled from the already-compiled per-arch binaries. It is marked
# experimental upstream; the classic `dockers` + `docker_manifests` pair is the
# fallback if it ever regresses.
dockers_v2:
  - id: mail-muncher
    ids:
      - mail-muncher
    images:
      - ghcr.io/craigjmidwinter/mail-muncher
    dockerfile: Dockerfile
    # Matches the linux half of the build matrix above. darwin has no container
    # equivalent, and Docker Desktop on a Mac runs the linux image anyway.
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ .Version }}"
      # Only a full release moves `latest`. A prerelease that grabbed it would
      # silently upgrade everyone who pulls the unqualified tag.
      - "{{ if not .Prerelease }}latest{{ end }}"
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: "https://github.com/craigjmidwinter/mail-muncher"
      org.opencontainers.image.licenses: MIT
    # Set on the manifest, not just the per-arch image configs. The MCP
    # Registry's ownership check reads the manifest, so the server name has to
    # survive here; it is also declared as a LABEL in the Dockerfile, and the
    # two must agree with `name` in server.json.
    annotations:
      io.modelcontextprotocol.server.name: "io.github.craigjmidwinter/mail-muncher"
      org.opencontainers.image.source: "https://github.com/craigjmidwinter/mail-muncher"
      org.opencontainers.image.description: "An email client for AI agents: filtered, read-only mail on disk, served over MCP."

# Keyless signing with cosign + GitHub OIDC. No long-lived key to manage: the
# signature is bound to this workflow's identity and logged in Rekor.
signs:
  - id: cosign-checksums
    cmd: cosign
    signature: ${artifact}.sig
    certificate: ${artifact}.pem
    args:
      - sign-blob
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}
      - --yes
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^katra:"
      - Merge pull request
      - Merge branch

homebrew_casks:
  - name: mail-muncher
    ids:
      - mail-muncher
    binaries:
      - mail-muncher
    repository:
      owner: craigjmidwinter
      name: homebrew-tap
      branch: main
      # Cross-repo push: the default GITHUB_TOKEN cannot write to another
      # repository, so this needs a PAT in the HOMEBREW_TAP_GITHUB_TOKEN
      # secret. When that secret is absent the env var is empty and
      # skip_upload below turns the tap update into a no-op rather than a
      # hard failure -- the release still ships binaries.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    skip_upload: '{{ if .Env.HOMEBREW_TAP_GITHUB_TOKEN }}false{{ else }}true{{ end }}'
    directory: Casks
    homepage: https://github.com/craigjmidwinter/mail-muncher
    description: An email client for AI agents -- filtered, read-only Gmail delivered to disk as .eml + markdown, and served over MCP.
    license: MIT
    commit_author:
      name: goreleaser[bot]
      email: 1444982+goreleaser[bot]@users.noreply.github.com
    commit_msg_template: "mail-muncher {{ .Tag }}"
    # The release binaries are not Apple-notarized, so Gatekeeper quarantines
    # them on download. Strip the attribute the way Homebrew itself recommends
    # for unsigned binaries.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/mail-muncher"]
          end

release:
  github:
    owner: craigjmidwinter
    name: mail-muncher
  prerelease: auto
  footer: |
    ## Install

    ```sh
    brew install craigjmidwinter/tap/mail-muncher
    ```

    Or download an archive below and verify it:

    ```sh
    # 1. checksum -- on macOS use `shasum -a 256` instead of `sha256sum`
    sha256sum --check --ignore-missing checksums.txt

    # 2. signature over the checksum file (keyless, no key to fetch)
    cosign verify-blob \
      --certificate checksums.txt.pem \
      --signature checksums.txt.sig \
      --certificate-identity-regexp '^https://github\.com/craigjmidwinter/mail-muncher/\.github/workflows/release\.yml@refs/tags/' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      checksums.txt
    ```
