name: Feature request
description: Propose a capability mail-muncher does not have
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Some things are deliberately out of scope and will be closed: writing to
        the mailbox (sending, replying, labelling, deleting, drafts), being a
        mail client with search/threading/UI, and a network API. See
        "Deliberately out of scope" in the README before filing.

        IMAP is already planned but unbuilt — comment on the existing issue
        rather than opening a new one.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and where does mail-muncher get in the way?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed shape
      description: If it is a config change, sketch the YAML. If it is a CLI or MCP change, sketch the call.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Existing rules, a wrapper script, another tool.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This does not require write access to the mailbox
          required: true
