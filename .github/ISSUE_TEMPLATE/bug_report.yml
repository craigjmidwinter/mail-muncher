name: Bug report
description: Something behaves differently from what the docs say
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste credentials.** `credentials.json`, `token.json`, and raw
        `.eml` files contain secrets and private mail. Redact addresses and
        message ids before pasting logs.

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `mail-muncher --version`
      placeholder: "v0.1.0 (or `dev`)"
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: OS and architecture
      placeholder: "macOS 15 arm64 / Ubuntu 24.04 amd64"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands you ran.
      render: shell
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant config
      description: The rule or account block involved, with paths and addresses redacted.
      render: yaml

  - type: textarea
    id: logs
    attributes:
      label: Output
      description: Ideally from `mail-muncher run --dry-run --log-level debug`. Redact before pasting.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: "`mail-muncher validate` passes (or I have included its output above)"
        - label: I have redacted credentials, tokens, email addresses, and message ids
