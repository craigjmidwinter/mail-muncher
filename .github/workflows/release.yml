name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and sign nothing; just validate the release config end to end"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    permissions:
      # Create the GitHub release and upload its assets.
      contents: write
      # Mint the short-lived OIDC token cosign exchanges for a signing
      # certificate. Without this, keyless signing cannot work.
      id-token: write
      # Push the container image to ghcr.io/craigjmidwinter/mail-muncher.
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # goreleaser needs full history and tags for the changelog and for
          # `git describe`-style version resolution.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # The image is Alpine and runs `apk add` and `adduser` at build time, so
      # the linux/arm64 layer is genuinely executed rather than just assembled.
      # On an amd64 runner that needs binfmt emulation; without QEMU the arm64
      # half of the manifest fails to build.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # dockers_v2 builds through buildx, which needs a builder instance that
      # can target more than the host platform.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Skipped on a dry run: --skip=publish means nothing is pushed, so there
      # is nothing to authenticate for, and a login there would only be a way
      # for the validation run to fail on credentials it never uses.
      - name: Log in to GHCR
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A missing tap token must be loud, not silent. The release still ships
      # binaries without it; only the Homebrew formula update is skipped.
      - name: Check Homebrew tap token
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -n "$HOMEBREW_TAP_GITHUB_TOKEN" ]; then
            echo "HOMEBREW_TAP_GITHUB_TOKEN is set; the tap will be updated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Homebrew tap not updated"
            echo
            echo "The \`HOMEBREW_TAP_GITHUB_TOKEN\` secret is not set on this repository,"
            echo "so \`craigjmidwinter/homebrew-tap\` was **not** updated for this release."
            echo "Binaries, checksums and signatures were still published."
            echo
            echo "To fix: create a token that can write to \`craigjmidwinter/homebrew-tap\`"
            echo "(fine-grained PAT, repository access limited to \`homebrew-tap\`,"
            echo "\`Contents: Read and write\`) and add it as the repository secret"
            echo "\`HOMEBREW_TAP_GITHUB_TOKEN\`. The default \`GITHUB_TOKEN\` cannot"
            echo "push to another repository."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Homebrew tap skipped::HOMEBREW_TAP_GITHUB_TOKEN is not set; craigjmidwinter/homebrew-tap was not updated."

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: >-
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run)
                && 'release --snapshot --clean --skip=publish,sign'
                || 'release --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Deliberately referenced even when unset: GitHub expands a missing
          # secret to the empty string, which .goreleaser.yml treats as
          # "skip the tap" rather than blowing up on an undefined variable.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Upload dry-run artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          retention-days: 7
          if-no-files-found: error

  # Listing the release in the MCP Registry, which is metadata only: it records
  # that this version exists and which image holds it. Kept as its own job that
  # needs `release`, because the entry names an image tag -- publishing before
  # goreleaser has pushed it would advertise something nobody can pull.
  mcp-registry:
    name: mcp registry
    needs: release
    # Tag pushes only. A workflow_dispatch run has a branch in GITHUB_REF_NAME
    # rather than a version, so there is no release for an entry to describe,
    # and a dry run pushes no image at all.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # The whole authentication story. `login github-oidc` trades this
      # workflow's identity for a short-lived registry token, so there is no
      # registry secret in this repository to store, rotate or leak, and no
      # device-code flow to sit through by hand.
      id-token: write
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      # The committed server.json carries the version of the *previous*
      # release, so by the time this runs it is stale by exactly one tag. The
      # tag is the truth. Both fields are rewritten from it, and they have to
      # move together: `version` is what the registry lists, `identifier` is
      # the image that version actually lives in.
      - name: Stamp the tag into server.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" \
             --arg img "ghcr.io/${{ github.repository }}:" \
            '.version = $v | .packages[0].identifier = $img + $v' \
            server.json > server.tmp && mv server.tmp server.json
          cat server.json

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
