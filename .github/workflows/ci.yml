name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build / vet / test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod download
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  # Cross-compiles all four release targets *through* the release config, so a
  # broken .goreleaser.yml fails here on every push rather than at tag time.
  release-dry-run:
    name: release dry run
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Validate release config
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ""

      # The snapshot below builds the container image too, and its linux/arm64
      # layer really executes `apk add` and `adduser` on an amd64 runner. That
      # needs binfmt emulation registered first, or the build dies with
      # "exec /bin/sh: exec format error" -- which is exactly how this job
      # first failed.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build a snapshot release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish,sign,announce
        env:
          # Empty on purpose: exercises the "no tap token" path, which must
          # skip the Homebrew update rather than fail the release.
          HOMEBREW_TAP_GITHUB_TOKEN: ""

      - name: Show what a release would contain
        run: ls -l dist/*.tar.gz dist/checksums.txt

      # server.json is only exercised during a tag release, which is a bad
      # place to discover it is malformed: the image is already pushed and the
      # GitHub release already cut by then. Validating on every PR moves that
      # failure to where it is cheap to fix.
      #
      # This checks shape, not version numbers -- the release workflow rewrites
      # `version` and the image tag from the tag before publishing, so the
      # values committed here are last release's and are expected to lag.
      - name: Validate server.json
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher validate
